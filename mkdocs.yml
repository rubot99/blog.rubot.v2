site_name: "rubot — thoughts from a software engineer"
site_url: https://rubot.co.uk
site_description: "Reuben's blog — a software engineer in Newcastle upon Tyne writing about distributed systems, architecture, and whatever else catches his interest."
site_author: Reuben

repo_url: https://github.com/rubot99/blog.rubot.v2
repo_name: rubot99/blog.rubot.v2

copyright: >
  Copyright &copy; 2026 Reuben Raj &mdash;
  content licensed under
  <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>

theme:
  name: material
  custom_dir: overrides
  favicon: assets/favicon.png
  icon:
    logo: material/robot
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight

nav:
  - index.md
  - About: about.md

plugins:
  - blog:
      blog_dir: .
      post_date_format: long
      post_url_format: "{slug}"
      archive: true
      archive_name: Archive
      archive_date_format: yyyy
      archive_url_date_format: yyyy
      categories: true
      categories_allowed:
        - Architecture
        - Books
        - Tech
        - Homelab
        - Self-Hosting
        - Development
      draft: false
      draft_on_serve: true
      pagination_per_page: 10
  - tags
  - search
  - rss:
      match_path: posts/.*
      pretty_print: true
      image: https://rubot.co.uk/assets/favicon.png
      date_from_meta:
        as_creation: date.created
        as_update: date.updated
      categories:
        - categories
        - tags

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/solid/rss
      link: /feed_rss_created.xml
    - icon: fontawesome/brands/github
      link: https://github.com/rubot99
    - icon: fontawesome/brands/linkedin
      link: "https://www.linkedin.com/in/reuben-raj-9b550759"
