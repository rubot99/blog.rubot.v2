site_name: Rubot
site_url: https://rubot.co.uk
site_description: "EDIT ME: one sentence on what this blog is about"
site_author: Reuben Raj

repo_url: https://github.com/rubot99/blog.rubot.v2
repo_name: rubot99/blog.rubot.v2

copyright: >
  Copyright &copy; 2026 Reuben Raj &mdash;
  content licensed under
  <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight

nav:
  - index.md
  - About: about.md

plugins:
  - blog:
      blog_dir: .
      post_date_format: long
      post_url_format: "{slug}"
      archive: true
      archive_name: Archive
      categories: true
      categories_allowed:
        - Architecture
        - Books
      draft: false
      draft_on_serve: true
      pagination_per_page: 10
  - tags
  - search
  - rss:
      match_path: posts/.*
      date_from_meta:
        as_creation: date
      categories:
        - categories
        - tags

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rubot99
    - icon: fontawesome/brands/linkedin
      link: "EDIT ME: your LinkedIn URL, or delete this entry"
